<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="panel.css"></head><body>
<header><span>H</span><div><b>Hinglish Editor</b><small id="connection">Connecting…</small></div></header><main>
<button class="mode active" data-mode="clean"><i>✂</i><span><b>Smart Clean</b><small>Selected timeline clips</small></span></button>
<button class="mode" data-mode="script"><i>≋</i><span><b>Script Edit</b><small>Arrange selected clips by meaning</small></span></button>
<button class="mode" data-mode="captions"><i class="cc">CC</i><span><b>Auto Captions</b><small>Premium animated Roman Hinglish</small></span></button>
<button class="mode" data-mode="broll"><i>▶</i><span><b>Add B-roll</b><small>Footage for what you say, on the open sequence</small></span></button>
<div id="brollBox" class="row hidden"><select id="density"><option value="low">Low B-roll</option><option value="medium" selected>Medium B-roll</option><option value="high">High B-roll</option></select></div>
<textarea id="script" class="hidden" placeholder="Script or optional caption spelling reference"></textarea>
<section id="captionBox" class="caption-box hidden"><small>Choose caption style</small><div class="caption-grid"><button class="caption-style" data-style="typography_1">Typography <em>1</em></button><button class="caption-style active" data-style="flash_cut">Flash <em>Cut</em></button><button class="caption-style serif" data-style="soft_focus">Soft <em>Focus</em></button><button class="caption-style" data-style="soft_2">Soft <em>2.0</em></button><button class="caption-style" data-style="real_estate">Real <em>Estate</em></button><button class="caption-style light" data-style="signal_bar">Signal <em>Bar</em></button><button class="caption-style light" data-style="focus_signal">Focus <em>Signal</em></button><button class="caption-style" data-style="cinematic_cut">Cinematic <em>Cut</em></button><button class="caption-style serif" data-style="aura_script">Aura <em>Script</em></button><button class="caption-style" data-style="punch">Creator <em>Punch</em></button><button class="caption-style" data-style="karaoke">Kinetic <em>Karaoke</em></button><button class="caption-style light" data-style="pill">Studio <em>Pill</em></button><button class="caption-style serif" data-style="editorial">Editorial <em>Serif</em></button><button class="caption-style glow" data-style="neon">Midnight <em>Glow</em></button><button class="caption-style" data-style="minimal">Quiet <em>Minimal</em></button></div></section>
<div class="row"><select id="format"><option value="source">Source format</option><option value="instagram_vertical">Instagram 9:16</option><option value="square">Square 1:1</option><option value="youtube_horizontal">YouTube 16:9</option></select><select id="device"><option value="cpu">CPU</option><option value="cuda">NVIDIA RTX</option></select></div>
<button id="run" class="run">Clean selected clips</button><section id="progress" class="hidden"><b id="status">Starting</b><progress max="100" value="0"></progress><small id="stage"></small></section><section id="done" class="hidden">✓ New editable sequence imported</section><p id="error"></p>
</main><script src="main.js"></script></body></html>
