<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="panel.css"></head>
<body><header><span class="logo">H</span><div><b>Hinglish Editor</b><small id="connection">Connecting to local AI…</small></div></header>
<main>
  <button class="feature active" data-mode="clean"><i>✂</i><span><b>Smart Clean</b><small>Remove silence from selected clips</small></span></button>
  <button class="feature" data-mode="script"><i>≋</i><span><b>Script Edit</b><small>Arrange selected clips by meaning</small></span></button>
  <button class="feature" data-mode="captions"><i class="cc">CC</i><span><b>Auto Captions</b><small>Premium animated Roman Hinglish</small></span></button>
  <button class="feature" data-mode="broll"><i>▶</i><span><b>Add B-roll</b><small>Footage for what you say, on the open sequence</small></span></button>
  <section id="brollBox" class="hidden"><label>How much B-roll<select id="density"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><small class="hint">Uses the sequence open now. Footage sources and API keys: Run Hinglish Editor.bat → Add B-roll → B-roll settings.</small></section>
  <section id="scriptBox" class="hidden"><label>Script or spelling reference</label><textarea id="script" placeholder="Optional for captions: paste a rough script to correct names and English spellings"></textarea></section>
  <section id="captionBox" class="caption-box hidden"><label>Choose caption style</label><div class="caption-grid"><button class="caption-style" data-style="typography_1">Typography <em>1</em></button><button class="caption-style active" data-style="flash_cut">Flash <em>Cut</em></button><button class="caption-style serif" data-style="soft_focus">Soft <em>Focus</em></button><button class="caption-style" data-style="soft_2">Soft <em>2.0</em></button><button class="caption-style" data-style="real_estate">Real <em>Estate</em></button><button class="caption-style light" data-style="signal_bar">Signal <em>Bar</em></button><button class="caption-style light" data-style="focus_signal">Focus <em>Signal</em></button><button class="caption-style" data-style="cinematic_cut">Cinematic <em>Cut</em></button><button class="caption-style serif" data-style="aura_script">Aura <em>Script</em></button><button class="caption-style" data-style="punch">Creator <em>Punch</em></button><button class="caption-style" data-style="karaoke">Kinetic <em>Karaoke</em></button><button class="caption-style light" data-style="pill">Studio <em>Pill</em></button><button class="caption-style serif" data-style="editorial">Editorial <em>Serif</em></button><button class="caption-style glow" data-style="neon">Midnight <em>Glow</em></button><button class="caption-style" data-style="minimal">Quiet <em>Minimal</em></button></div></section>
  <section class="options"><label>Format<select id="format"><option value="source">Same as sequence</option><option value="instagram_vertical">Instagram 9:16</option><option value="square">Square 1:1</option><option value="youtube_horizontal">YouTube 16:9</option></select></label><label>Speed<select id="device"><option value="cpu">CPU</option><option value="cuda">NVIDIA RTX</option></select></label></section>
  <button id="run" class="run">Use selected clips</button>
  <section id="progress" class="progress hidden"><div><b id="status">Starting</b><span id="percent">0%</span></div><progress max="100" value="0"></progress><p id="stage"></p></section>
  <section id="done" class="done hidden"><i>✓</i><span><b>New timeline imported</b><small>The original sequence was not changed.</small></span></section>
  <p id="error" class="error"></p>
</main><footer>Local processing · Editable timeline</footer><script src="js/config.js"></script><script src="js/main.js"></script></body></html>
