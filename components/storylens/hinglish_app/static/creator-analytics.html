<!doctype html>
<html lang="en" data-token="__APP_TOKEN__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator Analytics · StoryLens</title>
  <link rel="icon" href="/storylens-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="creator-analytics.css?v=visual-3">
  <script src="creator-analytics.js?v=voice-toolbar" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="index.html"><img src="/storylens-logo.svg" width="32" height="28" alt="">StoryLens</a>
      <nav aria-label="Analytics views">
        <span>Creator analytics</span>
        <button type="button" data-tab="overview" aria-current="page">Overview</button>
        <button type="button" data-tab="analytics">Analytics</button>
        <button type="button" data-tab="reports">Reports</button>
        <button type="button" data-tab="connections">Connections</button>
      </nav>
      <a class="back" href="index.html">← Back to editor</a>
    </aside>
    <div class="workspace">
      <header class="top"><span>Creator analytics</span><span class="hint">Four accounts · read-only</span></header>
      <main>
        <div class="heading">
          <div><h1 id="title">Overview</h1><p id="summary" class="hint" aria-live="polite">Loading saved analytics…</p></div>
          <button id="refresh" type="button" class="primary">Refresh accounts</button>
        </div>
        <p id="notice" class="hint" role="status" hidden></p>
        <div id="overview-scope" class="scope" role="group" aria-label="Overview scope" hidden>
          <button type="button" data-scope="all" aria-pressed="true">All accounts</button>
          <button type="button" data-scope="cricket" aria-pressed="false">Cricket</button>
          <button type="button" data-scope="gaming" aria-pressed="false">Gaming</button>
        </div>
        <div id="controls" class="controls" hidden>
          <label>Account <select id="account" aria-label="Account"></select></label>
          <label id="period-control">Report period <select id="period" aria-label="Report period">
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="annual">Annual</option>
          </select></label>
          <label id="month-control">Month <input id="month" type="month" min="2005-01"></label>
          <label id="quarter-control" hidden>Quarter <select id="quarter" aria-label="Quarter">
            <option value="1">Q1 · Jan–Mar</option><option value="2">Q2 · Apr–Jun</option>
            <option value="3">Q3 · Jul–Sep</option><option value="4">Q4 · Oct–Dec</option>
          </select></label>
          <label id="year-control" hidden>Year <input id="year" type="number" min="2005" step="1"></label>
          <label id="metric-control" hidden>Trend metric <select id="metric" aria-label="Trend metric"></select></label>
          <button id="download" type="button" hidden>Download annual CSV</button>
        </div>
        <div id="dashboard" aria-live="polite"></div>
        <footer class="hint">Daily refresh after 8:00 AM IST while StoryLens is running. Reports can lag behind current counters.</footer>
      </main>
    </div>
  </div>
  <dialog id="connect-dialog">
    <form id="connect-form">
      <h2 id="connect-title"></h2>
      <p id="connect-copy" class="hint"></p>
      <label id="money-label"><input id="monetary" type="checkbox"> Include estimated revenue</label>
      <a id="instagram-help" class="hint" href="chrome.html" hidden>Open StoryLens Chrome connection ↗</a>
      <div class="actions"><button id="cancel-connect" type="button">Cancel</button><button class="primary" type="submit">Connect</button></div>
    </form>
  </dialog>
  <dialog id="video-dialog" class="video-dialog">
    <div class="section-head"><h2 id="video-title">Video analytics</h2><button id="close-video" type="button">Close</button></div>
    <div id="video-detail" class="stack" aria-live="polite"></div>
  </dialog>
</body>
</html>
