<!doctype html><html lang="en" data-token="__APP_TOKEN__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sounds · Storylens</title><link rel="stylesheet" href="workbench.css"><script src="feedback.js"></script></head><body><main><header><h1>Sounds</h1><a href="/">Storylens</a></header>
<form id="import"><label>Audio file<input id="path" required placeholder="Full path to an owned or licensed recording"></label><label>Exact alias<input id="alias" required></label><label>Category<select id="category"></select></label><label>Permission or licence evidence<textarea id="evidence"></textarea></label><details><summary>Source and usage details</summary><label>Source URL or original location<input id="sound-source-url"></label><label>Attribution<input id="sound-attribution"></label><label>Allowed use<input id="sound-scope" placeholder="Describe the permitted uses"></label><label>Expiry date<input id="sound-expiry" type="date"></label></details><button>Import for review</button></form>
<p role="status" id="status"></p><label>Find exact alias or name<input id="search"></label><label>Browse sound category<select id="sound-category-filter"><option value="">All categories</option></select></label><div id="sounds"></div>
<details><summary>Prepare an ambience loop</summary><form id="loop-form">
<label>Original ambience<select id="loop-source" required></select></label>
<label>Source in point (seconds)<input id="loop-in" type="number" min="0" step="any" value="0" required></label>
<label>Loop segment length (seconds)<input id="loop-segment" type="number" min="0.5" max="60" step="any" value="5" required></label>
<label>Crossfade (seconds)<input id="loop-crossfade" type="number" min="0.02" max="5" step="any" value="0.25" required></label>
<label>Loop preview duration (seconds)<input id="loop-duration" type="number" min="1" max="120" step="any" value="10" required></label>
<button id="loop-render">Create loop for audition</button><p id="loop-status" role="status"></p>
</form></details>
<section><h2>Recipe preview</h2><label>Recipe<select id="recipe"></select></label><label>Original voice and music file<input id="original" placeholder="Full path to the original audio or video"></label><label>Reviewed dialogue intervals (seconds)<textarea id="dialogue" placeholder='[{"start":0,"end":3}]'>[]</textarea></label><details><summary>Timing and levels</summary><label id="impact-duration-label" hidden>Mix duration (seconds)<input id="impact-duration" type="number" min="0.01" max="3600" step="any"></label><label id="cue-anchor-label" hidden>Cue anchor (seconds)<input id="cue-anchor" type="number" min="0" max="3600" step="any"></label><label id="cue-tail-label" hidden>Impact tail (seconds)<input id="cue-tail" type="number" min="0.01" max="10" step="any" placeholder="1"></label><label>Loudness target (LUFS)<input id="mix-lufs" type="number" min="-36" max="-10" step="any" value="-14"></label><label>True peak ceiling (dBTP)<input id="mix-peak" type="number" min="-9" max="-1" step="any" value="-1"></label></details><div id="roles"></div><button id="mix">Render recipe preview</button><audio id="mixed" controls></audio><p>Original audio stays in the mix once. Dialogue intervals duck the effects. Review the result before approving it.</p></section>
<script src="sound-library.js"></script></main></body></html>
