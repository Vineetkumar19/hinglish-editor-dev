[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-auto-cutter"
version = "0.1.0"
description = "Local Hinglish script sequencing, silence removal and Premiere XML export"
requires-python = ">=3.10,<3.14"

[project.scripts]
hinglish-cut = "hinglish_cut.__main__:main"

[tool.setuptools.packages.find]
include = [
    "hinglish_cinematic*", "hinglish_beats*", "hinglish_cut*", "hinglish_clean*", "hinglish_semantic*", "hinglish_captions*", "hinglish_app*",
    "hinglish_broll*", "hinglish_visuals*", "hinglish_zoom*", "hinglish_sound*", "hinglish_eyecontact*",
    "hinglish_shorts*", "hinglish_aigen*", "hinglish_aiimage*", "hinglish_aivideo*", "hinglish_motion*",
    "hinglish_eval*", "hinglish_publish*", "hinglish_niche*", "hinglish_saas*", "hinglish_license*", "hinglish_photos*", "hinglish_voice*",
    "tools.editor_link*",
]

[tool.setuptools.package-data]
  hinglish_app = ["static/*", "knowledge/*.json", "error_catalog.json", "support_call_button_catalog.txt", "capcut_template.json", "templates/*", "phone_static/*"]
hinglish_captions = ["fonts/*", "*.js", "*.css", "*.json"]
hinglish_motion = ["web/*"]
hinglish_photos = ["*.jsx"]
