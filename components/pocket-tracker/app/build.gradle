plugins { id 'com.android.application' }
android {
    namespace 'in.pocketledger.app'
    compileSdk 35
    defaultConfig { applicationId 'in.pocketledger.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('.android-home/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { release { minifyEnabled false } }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE*','META-INF/NOTICE*'] }
}
dependencies {
    implementation project(':core')
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

