<!doctype html><html lang="en"><meta charset="utf-8"><title>Cortana workspace</title>
<body><h2>Cortana workspace</h2>
<label>Browser <select id="browser"><option>chrome</option><option>brave</option></select></label>
<label>Profile label <input id="profile" value="Default" maxlength="100"></label>
<p>Only tabs you select for capture are saved. Incognito is excluded.</p>
<button id="connect">Connect this profile</button>
<button id="youtube">Allow YouTube timestamp capture</button>
<button id="disconnect">Disconnect</button><p id="status" role="status"></p>
<script src="popup.js"></script></body></html>
