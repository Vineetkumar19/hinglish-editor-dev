[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hinglish-auto-cutter"
version = "0.1.0"
description = "Local Hinglish script sequencing, silence removal and Premiere XML export"
requires-python = ">=3.10,<3.14"

[project.scripts]
hinglish-cut = "hinglish_cut.__main__:main"

[tool.setuptools.packages.find]
include = ["hinglish_cut*", "hinglish_clean*", "hinglish_semantic*", "hinglish_captions*", "hinglish_app*"]

[tool.setuptools.package-data]
hinglish_app = ["static/*"]
